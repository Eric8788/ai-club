<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>3D 清新草地 - 极简白床与柔和微风</title>
    <style>
        body { margin: 0; overflow: hidden; background: #c2e5ff; }
        .ui {
            position: absolute; top: 30px; width: 100%; text-align: center;
            color: #5588aa; font-family: "Microsoft YaHei", sans-serif;
            letter-spacing: 4px; font-weight: 300; pointer-events: none;
            text-transform: uppercase; opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="ui">微风拂过 · 恬静之梦</div>
    <div id="container"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- 场景基础设置 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xb3d9ff); // 更晴朗的天空蓝
        scene.fog = new THREE.Fog(0xb3d9ff, 20, 90);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(-12, 8, 22); // 调整视角，侧向观察
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        document.getElementById('container').appendChild(renderer.domElement);

        // --- 光照：明亮的午后阳光 ---
        const ambient = new THREE.AmbientLight(0xffffff, 0.9);
        scene.add(ambient);

        const sun = new THREE.DirectionalLight(0xffffff, 1.2);
        sun.position.set(5, 20, 10);
        sun.castShadow = true;
        scene.add(sun);

        // --- 地面 (缓坡) ---
        const groundGeo = new THREE.PlaneGeometry(100, 100, 40, 40);
        const posAttr = groundGeo.attributes.position;
        for (let i = 0; i < posAttr.count; i++) {
            let x = posAttr.getX(i);
            let y = posAttr.getY(i);
            let z = Math.sin(x * 0.1) * Math.cos(y * 0.1) * 1.2;
            posAttr.setZ(i, z);
        }
        groundGeo.computeVertexNormals();
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x559944, roughness: 1 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // --- 全白 MC 风格床 (侧着摆) ---
        function createWhiteBed() {
            const bedGroup = new THREE.Group();
            const matWhite = new THREE.MeshStandardMaterial({ color: 0xffffff });
            const matGrey = new THREE.MeshStandardMaterial({ color: 0xf5f5f5 });
            const matLeg = new THREE.MeshStandardMaterial({ color: 0xeeeeee });

            const addBox = (w, h, d, x, y, z, mat) => {
                const geo = new THREE.BoxGeometry(w, h, d);
                const m = new THREE.Mesh(geo, mat);
                m.position.set(x, y, z);
                m.castShadow = true; m.receiveShadow = true;
                bedGroup.add(m);
            };

            addBox(3, 0.6, 5, 0, 0.6, 0, matWhite); // 床垫
            addBox(2.4, 0.25, 1.2, 0, 1.0, -1.8, matGrey); // 枕头
            
            // 四个极简腿
            const legH = 0.4;
            addBox(0.2, legH, 0.2, 1.3, 0.2, 2.3, matLeg);
            addBox(0.2, legH, 0.2, -1.3, 0.2, 2.3, matLeg);
            addBox(0.2, legH, 0.2, 1.3, 0.2, -2.3, matLeg);
            addBox(0.2, legH, 0.2, -1.3, 0.2, -2.3, matLeg);

            return bedGroup;
        }
        const bed = createWhiteBed();
        bed.rotation.y = Math.PI / 6; // 侧着摆放
        bed.position.set(0, 0.4, 0);
        scene.add(bed);

        // --- 核心：草地着色器 (带惯性和大范围风场) ---
        const grassCount = 60000;
        const grassGeo = new THREE.PlaneGeometry(0.12, 0.8, 1, 4);
        grassGeo.translate(0, 0.4, 0);

        const grassMat = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 },
                uWindPos: { value: new THREE.Vector3(100, 0, 100) },
                uWindRadius: { value: 15.0 } // 显著增大的影响范围
            },
            vertexShader: `
                varying vec2 vUv;
                varying float vWindEffect;
                uniform float uTime;
                uniform vec3 uWindPos;
                uniform float uWindRadius;

                void main() {
                    vUv = uv;
                    vec4 worldInstance = instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0);
                    vec3 pos = worldInstance.xyz;

                    // 计算风的距离
                    float dist = distance(pos, uWindPos);
                    // 使用非常平滑的衰减曲线
                    float force = smoothstep(uWindRadius, 0.0, dist);
                    vWindEffect = force;

                    // 基础微风：慢速且柔和
                    float baseSway = sin(uTime * 0.8 + pos.x * 0.2 + pos.z * 0.2) * 0.15;
                    
                    // 受风时的额外扰动：当风吹过，频率变快，振幅变大
                    float windSway = sin(uTime * 2.5 + pos.x * 0.5) * force * 0.4;

                    vec3 vPos = position;
                    float curve = pow(vUv.y, 2.0); // 只有草尖在动

                    // 风压效果
                    vec3 dir = normalize(pos - uWindPos);
                    if(dist > 0.1) {
                        vPos.xz += dir.xz * force * 1.8 * curve; 
                    }
                    
                    // 叠加所有晃动
                    vPos.x += (baseSway + windSway) * curve;
                    vPos.y -= force * 0.5 * curve; // 被压低

                    gl_Position = projectionMatrix * modelViewMatrix * instanceMatrix * vec4(vPos, 1.0);
                }
            `,
            fragmentShader: `
                varying vec2 vUv;
                varying float vWindEffect;
                void main() {
                    vec3 colorLow = vec3(0.25, 0.45, 0.15);
                    vec3 colorHigh = vec3(0.5, 0.75, 0.3);
                    // 风吹过的地方草色稍微亮一点，模拟反光
                    vec3 finalColor = mix(colorLow, colorHigh, vUv.y + vWindEffect * 0.2);
                    gl_FragColor = vec4(finalColor, 1.0);
                }
            `,
            side: THREE.DoubleSide
        });

        const iMesh = new THREE.InstancedMesh(grassGeo, grassMat, grassCount);
        const dummy = new THREE.Object3D();
        for (let i = 0; i < grassCount; i++) {
            let x = (Math.random() - 0.5) * 70;
            let z = (Math.random() - 0.5) * 70;
            // 避开床
            if (Math.abs(x) < 4 && Math.abs(z) < 4) x += 8;

            let y = Math.sin(x * 0.1) * Math.cos(z * 0.1) * 1.2;
            dummy.position.set(x, y, z);
            dummy.rotation.y = Math.random() * Math.PI;
            dummy.scale.setScalar(0.6 + Math.random() * 0.8);
            dummy.updateMatrix();
            iMesh.setMatrixAt(i, dummy.matrix);
        }
        scene.add(iMesh);

        // --- 逻辑：惯性风场追踪 ---
        const mouse = new THREE.Vector2();
        const targetPoint = new THREE.Vector3(100, 0, 100);
        const lerpPoint = new THREE.Vector3(100, 0, 100);
        const raycaster = new THREE.Raycaster();

        window.addEventListener('mousemove', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(ground);
            if (intersects.length > 0) {
                targetPoint.copy(intersects[0].point);
            }
        });

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now() * 0.001;

            // 【关键】极低系数的 Lerp 创造出空气的厚重感和延迟感
            // 0.015 意味着风会慢悠悠地跟过来，并在鼠标停下后继续滑动一小段
            lerpPoint.lerp(targetPoint, 0.015);
            
            grassMat.uniforms.uTime.value = time;
            grassMat.uniforms.uWindPos.value.copy(lerpPoint);

            // 摄像机极微小的呼吸感晃动
            camera.position.x += Math.sin(time * 0.5) * 0.003;
            camera.position.y += Math.cos(time * 0.5) * 0.003;

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
